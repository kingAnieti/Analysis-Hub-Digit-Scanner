<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deriv Analysis Hub - AI Market Matrix</title>

    <!-- Tailwind Play CDN (Forces Instant Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      // Configure Custom Theme Colors for Tailwind CDN
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyan: {
                300: '#67e8f9',
                400: '#00f0ff',
                500: '#00d8e6',
                600: '#0891b2',
              }
            }
          }
        }
      }
    </script>

    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in {
        animation: fadeIn 0.2s ease-out forwards;
      }
      /* Ensure scrollbars stay dark */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0d0e12;
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2430;
        border-radius: 3px;
      }
    </style>
  </head>
  <body class="bg-[#0a0b0e] text-white antialiased selection:bg-cyan-500 selection:text-black min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
